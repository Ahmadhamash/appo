name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_SECRET: ci-only-auth-secret-with-more-than-32-characters
      DATABASE_URL: postgresql://jormall_ci:jormall_ci_password@localhost:5432/jormall_ci
      DEV_SEED_PASSWORD: ci-only-development-password
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      TEST_DATABASE_URL: postgresql://jormall_ci:jormall_ci_password@localhost:5432/jormall_ci
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: jormall_ci
          POSTGRES_PASSWORD: jormall_ci_password
          POSTGRES_USER: jormall_ci
        options: >-
          --health-cmd "pg_isready -U jormall_ci -d jormall_ci" --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Configure Node.js
        uses: actions/setup-node@v5
        with:
          cache: pnpm
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate database types
        run: pnpm db:generate

      - name: Apply reviewed migrations
        run: pnpm db:migrate:deploy

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Check formatting
        run: pnpm format:check

      - name: Lint source
        run: pnpm lint

      - name: Check architecture boundaries
        run: pnpm lint:boundaries

      - name: Type-check workspace
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Run PostgreSQL integration tests
        run: pnpm test:integration

      - name: Build applications
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Seed development-only browser fixtures
        run: pnpm db:seed

      - name: Run browser smoke tests
        run: pnpm test:e2e
